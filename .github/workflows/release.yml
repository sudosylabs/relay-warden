name: release

on:
  push:
    tags: ['v*']
  # Manual runs build and test only; they never create a release.
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.meta.outputs.version }}
      sha: ${{ steps.meta.outputs.sha }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate workflows
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint"
      - id: meta
        name: Validate source and version
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = push ]; then
            git merge-base --is-ancestor HEAD origin/main
            python3 scripts/release.py metadata --tag "$TAG" >> "$GITHUB_OUTPUT"
          else
            python3 scripts/release.py metadata >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install Rust
        run: rustup toolchain install 1.91.0 --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16
        with:
          shared-key: ${{ runner.os }}-${{ runner.arch }}-1.91.0-release
      - name: Verify native target
        env:
          TARGET: ${{ matrix.target }}
        run: |
          test "$(rustc -vV | sed -n 's/host: //p')" = "$TARGET"
      - name: Verify tagged source
        run: bash scripts/check.sh
      - name: Build server and test client
        run: cargo build --locked --release --bin relay-warden --example relayed_transfer
      - name: Package and test the archive
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          TARGET: ${{ matrix.target }}
          SOURCE_SHA: ${{ needs.validate.outputs.sha }}
        run: |
          bash scripts/package.sh "$VERSION" "$TARGET" target/release dist
          python3 scripts/release.py inspect "dist/relay-warden-v$VERSION-$TARGET.tar.gz" --version "$VERSION" --target "$TARGET" --sha "$SOURCE_SHA"
          bash scripts/smoke.sh "dist/relay-warden-v$VERSION-$TARGET.tar.gz" target/release/examples/relayed_transfer
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [validate, build]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: package-*
          path: artifacts
          merge-multiple: false
      - name: Verify and collect release assets
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          SOURCE_SHA: ${{ needs.validate.outputs.sha }}
        run: python3 scripts/release.py collect artifacts dist --version "$VERSION" --sha "$SOURCE_SHA"
      - name: Stage draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.validate.outputs.version }}
          SOURCE_SHA: ${{ needs.validate.outputs.sha }}
        run: python3 scripts/release.py publish dist --version "$VERSION" --sha "$SOURCE_SHA"
