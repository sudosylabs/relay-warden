# relay-warden production config example. Copy to /etc/relay-warden/warden.toml
# and choose your access mode, speeds, and monthly allocation before starting.
listen = "127.0.0.1:8080"
max_handshake_concurrency = 64
handshake_timeout_secs = 10
key_cache_capacity = 1024

db_path = "/var/lib/relay-warden/warden.db"
admin_listen = "127.0.0.1:8081"
admin_token_file = "/var/lib/relay-warden/admin.token"

# Ordinary endpoints: explicit caps required (no silent throughput choice).
# 100 KB/s in each direction. Choose speeds for your users.
default_rx_bps = 100_000
default_tx_bps = 100_000
require_default_limits = true

# Illustrative monthly budget: 100 GB decimal. Choose your own allocation.
# Charged bytes = payload + overhead allowance; cutoff = budget - headroom.
# Leave room for traffic from other services on the same server.
quota_budget_bytes = 100_000_000_000
quota_headroom_bytes = 1_000_000_000
quota_overhead_pct = 10
quota_chunk_bytes = 32768
require_quota_budget = true

# Connection ceilings (DoS bounds, not throughput).
max_connections = 1024
max_connections_per_endpoint = 16
require_endpoint_approval = false

# Optional destination for monthly budget notifications.
# alert_webhook_url = "https://hooks.example.com/warden"

# Network defaults are documented in CONFIGURATION.md. Explicitly trust
# controlled proxy socket IPs if using X-Forwarded-For; never arbitrary peers.
[network]
trusted_proxies = []
