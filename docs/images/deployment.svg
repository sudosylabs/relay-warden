<svg xmlns="http://www.w3.org/2000/svg" width="900" height="310" viewBox="0 0 900 310" role="img" aria-labelledby="title desc">
  <title id="title">Relay Warden deployment</title>
  <desc id="desc">Devices reach a shared HTTPS proxy, then Relay Warden on private port 8080. The administrator uses an SSH tunnel to the private dashboard on port 8081. SQLite stores policies and usage. Other apps can share the proxy.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#475569"/></marker></defs>
  <rect width="900" height="310" rx="12" fill="#fafaf9"/>
  <g font-family="system-ui, sans-serif" fill="#1c1917" font-size="16">
    <rect x="250" y="22" width="625" height="266" rx="10" fill="#fff" stroke="#d6d3d1"/>
    <text x="272" y="49" font-size="14" fill="#57534e">YOUR SERVER · only the HTTPS edge is public</text>
    <rect x="22" y="74" width="165" height="62" rx="7" fill="#fff" stroke="#a8a29e"/>
    <text x="104" y="110" text-anchor="middle">Iroh devices</text>
    <rect x="285" y="74" width="175" height="62" rx="7" fill="#f5f5f4" stroke="#a8a29e"/>
    <text x="372" y="101" text-anchor="middle">Caddy / Nginx</text>
    <text x="372" y="121" text-anchor="middle" font-size="13" fill="#57534e">HTTPS · port 443</text>
    <rect x="540" y="74" width="175" height="62" rx="7" fill="#f5f5f4" stroke="#a8a29e"/>
    <text x="627" y="101" text-anchor="middle">Relay Warden</text>
    <text x="627" y="121" text-anchor="middle" font-size="13" fill="#57534e">private · port 8080</text>
    <rect x="755" y="74" width="95" height="62" rx="7" fill="#fff" stroke="#a8a29e"/>
    <text x="802" y="110" text-anchor="middle" font-size="14">SQLite</text>
    <rect x="22" y="201" width="165" height="62" rx="7" fill="#fff" stroke="#a8a29e"/>
    <text x="104" y="237" text-anchor="middle">Your browser</text>
    <rect x="540" y="201" width="175" height="62" rx="7" fill="#f5f5f4" stroke="#a8a29e"/>
    <text x="627" y="228" text-anchor="middle">Admin dashboard</text>
    <text x="627" y="248" text-anchor="middle" font-size="13" fill="#57534e">private · port 8081</text>
    <text x="372" y="181" text-anchor="middle" font-size="13" fill="#57534e">Other hostnames</text>
    <text x="372" y="201" text-anchor="middle" font-size="13" fill="#57534e">can serve other apps</text>
    <text x="225" y="91" text-anchor="middle" font-size="12" fill="#57534e">HTTPS</text>
    <text x="500" y="91" text-anchor="middle" font-size="12" fill="#57534e">local</text>
    <text x="352" y="224" text-anchor="middle" font-size="13" fill="#57534e">private SSH tunnel</text>
  </g>
  <g fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)">
    <path d="M187 105H283"/><path d="M460 105H538"/><path d="M715 105H753"/>
    <path d="M187 242H538"/><path d="M372 136V158"/>
  </g>
</svg>
