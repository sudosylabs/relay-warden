[package]
name = "relay-warden"
version = "0.1.0"
edition = "2021"
description = "Private Iroh relay with endpoint approval, per-endpoint limits, and shared monthly budget. Generic, self-hostable."
license = "MIT OR Apache-2.0"
readme = "README.md"
rust-version = "1.91"

[[bin]]
name = "relay-warden"
path = "src/main.rs"

[lib]
name = "relay_warden"
path = "src/lib.rs"

[dependencies]
iroh-relay = { version = "1.3.0", features = ["server"] }
iroh-base = "1.3.0"
axum = { version = "0.8", features = ["ws", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "io-util"] }
bytes = "1.11"
http = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.0"
clap = { version = "4", features = ["derive"] }
n0-future = "0.3"
n0-error = "1.0.0"
anyhow = "1"
rustls = { version = "0.23", features = ["ring"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
tower-http = { version = "0.6", features = ["limit"] }
rusqlite = { version = "0.37", features = ["bundled"] }
subtle = "2"
base64 = "0.22"
rand = "0.10"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
iroh-dns = "1.3.0"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "cookies"] }
rand = "0.10"
rand_chacha = "0.10"
rustls = { version = "0.23", features = ["ring"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
